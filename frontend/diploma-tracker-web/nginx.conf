server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The largest API request is a 20 MB document plus form overhead (DocumentsController).
    client_max_body_size 25m;

    # API calls go to the backend container over the compose network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints asset file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve the app shell, never a stale copy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
